# Set PREFIX to Alt-A
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Set the delay between prefix and command
set -s escape-time 1

# Set the base index for windows to 1 instead of 0
set -g base-index 1

# Set the base index for panes to 1 instead of 0
set -w -g pane-base-index 1

# Reload config with PREFIX r
bind r \
        source-file ~/.config/tmux/tmux.conf \; \
        display-message "Configuration Reloaded"

# Split panes with | and -
bind | split-window -h
bind - split-window -v

# Move between panes with Prefix h,j,k,l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Move between windows with Prefix alt-h and alt-l
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Mouse controls
set -g mouse on

# Set the default terminal mode to 256color mode
set -g default-terminal "tmux-256color"

# ---- Catppuccin Macchiato -------------------------------------------------
# One flat layer of literal hex, unlike the Zebar bar's catppuccin.css which
# splits a raw ramp from semantic aliases. tmux expands formats exactly one
# level deep -- #{@accent} resolves, but an @accent defined as "#{@mauve}"
# comes back as the literal text "#{@mauve}" -- so an alias pointing at another
# token silently renders as garbage. Names are semantic; values are direct.
#
# Style options (status-style, *-border-style) are parsed as colour specs when
# set and are never format-expanded, so they take hex literals below, not these.
set -g @base      "#24273a"
set -g @surface   "#363a4f"
set -g @text      "#cad3f5"
set -g @dim       "#a5adcb"
set -g @accent    "#c6a0f6"
set -g @accent_fg "#24273a"
set -g @sky       "#91d7e3"
set -g @green     "#a6da95"
set -g @peach     "#f5a97f"
set -g @yellow    "#eed49f"

# Rounded caps: U+E0B6 / U+E0B4, the Powerline half circles. Closest a terminal
# gets to the bar's border-radius, and present in the Nerd Font wezterm loads.
set -g @cap_l ""
set -g @cap_r ""

# ---- Status bar -----------------------------------------------------------
# Islands over the terminal background rather than a filled bar: bg=default
# lets wezterm's gradient show between segments the same way the wallpaper
# shows between the Zebar pills.
set -g status-style fg=#cad3f5,bg=default
set -g window-status-separator " "

# Colors for pane borders
set -w -g pane-border-style fg=#494d64,bg=default
set -w -g pane-active-border-style fg=#c6a0f6,bg=default

# Pane border style: single, double, heavy, simple, number.
set -w -g pane-border-lines single

# Add indicators for two-pane setup
set -g pane-border-indicators arrows

# Add status to panes
set -g pane-border-status off # was top, I dont like it

# Active pane normal, other shaded out
set -g window-style fg=color240,bg=default
set -g window-active-style fg=white,bg=default

# Command / message line
set -g message-style fg=white,bg=default,bold

# Session pill, in the accent -- the counterpart of the bar's mauve launcher.
set -g status-left-length 40
set -g status-left "#[fg=#{@accent}]#[bg=default]#{@cap_l}#[fg=#{@accent_fg}]#[bg=#{@accent}]#[bold]  #S #[none]#[fg=#{@accent}]#[bg=default]#{@cap_r} "

# Windows are the workspaces: active takes the accent, the rest sit quiet on
# surface. Each is its own pill, since tmux formats windows individually and
# cannot wrap the whole list in one container the way the bar's flexbox does.
set -g window-status-format "#[fg=#{@surface}]#[bg=default]#{@cap_l}#[fg=#{@dim}]#[bg=#{@surface}] #I #W #[fg=#{@surface}]#[bg=default]#{@cap_r}"
set -g window-status-current-format "#[fg=#{@accent}]#[bg=default]#{@cap_l}#[fg=#{@accent_fg}]#[bg=#{@accent}]#[bold] #I #W #[none]#[fg=#{@accent}]#[bg=default]#{@cap_r}"

# Right side: state segments that only appear when true, then the clock.
# Written inline with one #[..] per attribute rather than #[fg=x,bg=y]: inside
# #{?cond,a,b} a comma ends the argument, so a two-part style spec gets torn in
# half at its own comma. Hoisting segments into their own options does not help
# either -- that needs a second level of expansion, which tmux does not do.
set -g status-right-length 100
set -g status-right "#{?client_prefix,#[fg=#{@peach}]#[bg=default]#{@cap_l}#[fg=#{@accent_fg}]#[bg=#{@peach}]#[bold] PREFIX #[none]#[fg=#{@peach}]#[bg=default]#{@cap_r} ,}#{?window_zoomed_flag,#[fg=#{@surface}]#[bg=default]#{@cap_l}#[fg=#{@yellow}]#[bg=#{@surface}]  zoom #[fg=#{@surface}]#[bg=default]#{@cap_r} ,}#{?pane_synchronized,#[fg=#{@surface}]#[bg=default]#{@cap_l}#[fg=#{@green}]#[bg=#{@surface}]  sync #[fg=#{@surface}]#[bg=default]#{@cap_r} ,}#[fg=#{@surface}]#[bg=default]#{@cap_l}#[fg=#{@sky}]#[bg=#{@surface}] %a %d %b  %H:%M #[fg=#{@surface}]#[bg=default]#{@cap_r}"

# Windows sit next to the session pill, as the bar's workspaces do.
set -g status-justify left

# Five seconds, not sixty: the clock shows minutes, and continuum piggybacks on
# this refresh to decide when to save.
set -g status-interval 5

# Enable vi keys.
set -w -g mode-keys vi

# Use vim keybindings for copy-paste
bind Escape copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
unbind p
bind p paste-buffer

# Copy to the Windows clipboard via OSC 52 (tmux forwards it to WezTerm).
# Replaces clip.exe, which decoded UTF-8 as CP437 and mangled em dashes.
set -s set-clipboard on
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection

# Split pane and retain the current directory of existing pane
bind _ split-window -v -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"

# Prefix-free splits, always in the current directory.
# Named the way vim names them, not the way tmux's flags do: C-/ is the
# "vertical split" that puts panes side by side, same as nvim's <leader>sv.
# Ctrl+/ reaches tmux as C-_ (see tmux#1827), which is what has to be bound.
bind -n C-_ split-window -h -c "#{pane_current_path}"
bind -n C-\\ split-window -v -c "#{pane_current_path}"

# Shortcut for synchronize-panes toggle
bind C-s set-window-option synchronize-panes

# Popup
bind 0 display-popup -d "~/" \
	-x C -y C -w 50% -h 50% \
	-e "POPUP=true" -E "bash"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'omerxx/tmux-sessionx'

# resurrect only saves when asked, which is why the newest save on this machine
# was two days old when the server went down. continuum saves on a timer and
# restores on server start, so an unplanned exit costs minutes, not everything.
#
# Note continuum works by prepending a hidden interpolation to status-right --
# that is its timer. Anything that sets status-right after tpm runs silently
# removes the hook and stops auto-saving. The status bar above is configured
# before this block for exactly that reason.
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# Session switcher on prefix+o. zoxide mode means the list is ranked by where
# you actually work rather than alphabetically; fzf and zoxide are both already
# installed, which is all it needs.
set -g @sessionx-bind 'o'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-preview-enabled 'true'
set -g @vim_navigator_prefix_mapping_clear_screen ''
# Give up "previous pane" to free C-\ for splitting. The plugin binds this at
# root level, so without this the split binding below is silently overridden.
set -g @vim_navigator_mapping_prev ''

# Initialize Plugin Manager
run '~/.config/tmux/plugins/tpm/tpm'
