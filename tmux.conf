# Prefix is C-a, as a root binding instead of the prefix option: tmux checks
# the prefix option before any binding, so nothing could run on the press
# itself. This way each press also starts scripts/which-key.sh, which pops up
# what the next key does if you pause. @wk_n numbers the presses, so a timer
# left over from an earlier C-a never opens a popup.
unbind C-b
set -g prefix None
bind -n C-a set -gF @wk_n '#{e|+:#{@wk_n},1}' \; switch-client -T prefix \; run-shell -b '~/.config/tmux/scripts/which-key.sh "#{client_name}" "#{@wk_n}" "#{window_id} #{pane_id} #{window_layout}"'
bind -N "Send C-a to the pane" C-a send-keys C-a

# Keep the prefix (and the prefix+a agent table) through mouse motion.
# Any pane wanting all-motion mouse reports -- the workmux sidebar, Claude
# Code, lazygit -- puts the whole terminal in that mode, so the slightest
# mouse twitch after C-a arrives as a mouse-move key. A key with no binding in
# the prefix table drops the client back to root, which made the prefix last
# milliseconds. tmux 3.4 cannot bind mouse moves by name, but an unbound key
# falls through to `Any`, and only mouse events set #{mouse_x}: re-enter the
# table for those. Side effect: a click right after the prefix is swallowed
# and the prefix stays up.
bind -T prefix Any if -F '#{!=:#{mouse_x},}' 'switch-client -T prefix'
bind -T agent  Any if -F '#{!=:#{mouse_x},}' 'switch-client -T agent'

# How long tmux waits after a bare ESC to see whether the rest of an escape
# sequence follows. NOT "the delay between prefix and command", which is what
# this comment used to say.
#
# ⚠️ WAS 1ms, AND THAT WAS THE RANDOM GARBAGE-INPUT BUG. Input reaches tmux
# through ConPTY (OpenConsole.exe sits between WezTerm and wsl.exe), which
# splits escape sequences across reads under load. With 1ms, tmux decided a
# split ESC was a lone Escape keypress and passed the rest through as typed
# text -- so mouse reports landed in the prompt as "35;7;13M35;8;13M..." for as
# long as the mouse moved, and palette replies as "rgb:0000/afaf/ffff...". Both
# were caught in zsh history. It struck during Claude Code output and session
# switches because those are output bursts, which widen the gap.
#
# 20ms reassembles them; the only cost is a bare Escape taking up to 20ms to
# register, below perception. nvim's healthcheck only complains above 300.
set -s escape-time 20

# Set the base index for windows to 1 instead of 0
set -g base-index 1

# Set the base index for panes to 1 instead of 0
set -w -g pane-base-index 1

# Reload config with PREFIX r
bind -N "Reload tmux.conf (re-runs plugins)" r \
        source-file ~/.config/tmux/tmux.conf \; \
        display-message "Configuration Reloaded"

# Split panes with | and -
bind -N "Split left/right" | split-window -h
bind -N "Split top/bottom" - split-window -v

# Move between panes with Prefix h,j,k,l
bind -N "Pane left" h select-pane -L
bind -N "Pane down" j select-pane -D
bind -N "Pane up" k select-pane -U
bind -N "Pane right" l select-pane -R

# Move between windows with Prefix alt-h and alt-l
bind -r -N "Previous window" C-h select-window -t :-
bind -r -N "Next window" C-l select-window -t :+

# Resize panes
bind -r -N "Resize pane left" H resize-pane -L 5
bind -r -N "Resize pane down" J resize-pane -D 5
bind -r -N "Resize pane up" K resize-pane -U 5
bind -r -N "Resize pane right" L resize-pane -R 5

# Send the current window, panes intact, to a session: pick one or type a new name.
# display-popup does not format-expand its command, so the ids go through
# user options (set -F does expand) and the script reads them back.
bind -N "Send this window to a session (pick or new)" S set -gF @w2s_window '#{window_id}' \; set -gF @w2s_client '#{client_name}' \; display-popup -w 60% -h 50% -E '~/.config/tmux/scripts/window-to-session-pick.sh'

# lazygit over the current pane, in that pane's repo; q closes it.
# -d is format-expanded even though the popup command is not, so the
# directory can go straight in without the user-option relay above.
bind -N "lazygit in this directory" g display-popup -w 90% -h 85% -d '#{pane_current_path}' -E lazygit

# Jump to a workmux agent by the number its sidebar row leads with: prefix+a 3.
# n/p step through them. Alt+digit is workmux's own suggestion, but GlazeWM
# takes alt+1-9 for workspaces, so a key table it is. The script, not
# `workmux sidebar jump`, does the switch: see its header for why. Like C-a,
# entering the table starts which-key, so pausing there lists the agents.
bind -N "Agent jump: then 1-9, n, p" a set -gF @wk_n '#{e|+:#{@wk_n},1}' \; switch-client -T agent \; run-shell -b '~/.config/tmux/scripts/which-key.sh "#{client_name}" "#{@wk_n}" "#{window_id} #{pane_id} #{window_layout}" agent'
bind -N "Jump to agent 1" -T agent 1 run-shell '~/.config/tmux/scripts/agent-jump.sh 1 "#{client_name}" "#{pane_id}" "#{window_id}" "#{session_name}"'
bind -N "Jump to agent 2" -T agent 2 run-shell '~/.config/tmux/scripts/agent-jump.sh 2 "#{client_name}" "#{pane_id}" "#{window_id}" "#{session_name}"'
bind -N "Jump to agent 3" -T agent 3 run-shell '~/.config/tmux/scripts/agent-jump.sh 3 "#{client_name}" "#{pane_id}" "#{window_id}" "#{session_name}"'
bind -N "Jump to agent 4" -T agent 4 run-shell '~/.config/tmux/scripts/agent-jump.sh 4 "#{client_name}" "#{pane_id}" "#{window_id}" "#{session_name}"'
bind -N "Jump to agent 5" -T agent 5 run-shell '~/.config/tmux/scripts/agent-jump.sh 5 "#{client_name}" "#{pane_id}" "#{window_id}" "#{session_name}"'
bind -N "Jump to agent 6" -T agent 6 run-shell '~/.config/tmux/scripts/agent-jump.sh 6 "#{client_name}" "#{pane_id}" "#{window_id}" "#{session_name}"'
bind -N "Jump to agent 7" -T agent 7 run-shell '~/.config/tmux/scripts/agent-jump.sh 7 "#{client_name}" "#{pane_id}" "#{window_id}" "#{session_name}"'
bind -N "Jump to agent 8" -T agent 8 run-shell '~/.config/tmux/scripts/agent-jump.sh 8 "#{client_name}" "#{pane_id}" "#{window_id}" "#{session_name}"'
bind -N "Jump to agent 9" -T agent 9 run-shell '~/.config/tmux/scripts/agent-jump.sh 9 "#{client_name}" "#{pane_id}" "#{window_id}" "#{session_name}"'
bind -N "Next agent" -T agent n run-shell '~/.config/tmux/scripts/agent-jump.sh next "#{client_name}" "#{pane_id}" "#{window_id}" "#{session_name}"'
bind -N "Previous agent" -T agent p run-shell '~/.config/tmux/scripts/agent-jump.sh prev "#{client_name}" "#{pane_id}" "#{window_id}" "#{session_name}"'

# Next/previous agent down/up the sidebar, repeatable like C-h/C-l for windows:
# hold Ctrl and tap j j j. The bare C-j/C-k stay with vim-tmux-navigator.
bind -r -N "Next workmux agent (sidebar order)" C-j run-shell '~/.config/tmux/scripts/agent-jump.sh next "#{client_name}" "#{pane_id}" "#{window_id}" "#{session_name}"'
bind -r -N "Previous workmux agent (sidebar order)" C-k run-shell '~/.config/tmux/scripts/agent-jump.sh prev "#{client_name}" "#{pane_id}" "#{window_id}" "#{session_name}"'

# Agent panel: every directory a Claude or Codex session ran in, live agents
# first, with its sessions and a timeline beside it (~/.local/bin/agent-panel).
# Enter goes to the live agent there, else opens a window in that directory.
# The client goes through a user option, as on prefix+S.
bind -N "Agent panel: every directory an agent ran in" A set -gF @ap_client '#{client_name}' \; display-popup -w 90% -h 85% -E '~/.local/bin/agent-panel "$(tmux show-option -gqv @ap_client)"'

# Flip to the previous session and back, like X swapping colours in Photoshop.
# That session is also sessionx's top row; the status bar names it as "⇄ name".
# The default for this is prefix+L, which the resize bindings took.
bind -N "Flip to the last session" Tab switch-client -l

# Hand this pane's conversation to a fresh claude in a new window here: the full
# Claude transcript (or the scrollback, if no Claude runs in the pane) goes to
# ~/.cache/handoff/, then a popup buffer sets model, effort, skills and the
# first prompt before anything starts. #{q:} escapes for run-shell's sh: a bare
# "#{session_id}" is "$3", which sh expands to empty.
bind -N "Hand this pane's transcript to a new claude window" T run-shell -b '~/.config/tmux/scripts/handoff.py #{q:pane_id} #{q:pane_pid} #{q:pane_current_path} #{q:session_id} #{q:client_name}'

# The skill badge: a Claude pane's preset or main skill. scripts/skill-badge
# keeps the pane options (handoff.py at launch, a Claude Code hook as skills
# load). The focused pane's badge goes out as the terminal title, and WezTerm
# draws the title top right of its window; more segments can join the title
# later without touching WezTerm. Nothing else reads WezTerm's title: GlazeWM
# matches it by process. A pane without a badge sends "· <session>" instead of
# nothing, so the bar always says where you are; the "· " marks the fallback.
set -g set-titles on
set -g set-titles-string '#{?#{@skill_badge},#{@skill_badge},· #{session_name}}'
# run-shell first: display-popup does not expand formats in its command (3.4),
# so a bare #{pane_id} there reaches sh as a comment.
bind -N "Skill status of this pane" B run-shell -b 'tmux display-popup -c #{q:client_name} -t #{q:pane_id} -w 80% -h 50% -T " skills " -E "~/.config/tmux/scripts/skill-badge show #{q:pane_id}"'
# The per-pane prototype, off: `skill-badge on` draws badges in a top border
# line, which costs a row in each window that has one; `off` gives it back.
set -g pane-border-format '#{?#{@skill_badge},#[align=right]#[fg=#{@thm_crust}#,bg=#{@thm_mauve}#,bold] #{@skill_badge} #[default],}'

# Size windows to the LARGEST attached client, not the most recent one.
#
# tmux does not reflow scrollback when a pane's width changes -- history keeps
# the wrapping it had when it was printed. Claude Code reflows its input area
# on resize but not the transcript above it, so any width change leaves the
# history wrapped for the old width and it reads as garbage in copy mode.
#
# With `latest` (the default), whichever client touched tmux most recently sets
# the size, so a narrow client attaching anywhere snaps that window to its
# width and corrupts everything already in the buffer. `largest` pins the size
# to the widest client instead: the main terminal always renders correctly and
# a smaller client gets a cropped view, which is the right trade for a
# secondary client.
#
# This removes one cause, not all of them: splitting a pane and `prefix z`
# both change a pane's width too, and will do the same thing to Claude Code's
# transcript.
set -g window-size largest

# Mouse controls
set -g mouse on

# Keep the right-click menus open after the button comes up. tmux's stock
# MouseDown3 bindings open them without -O, so a plain click (press, release)
# closed the menu the instant it drew; only press-drag-release to an item
# worked. This adds -O to the stock bindings in place rather than copying
# their 2 KB of menu definitions here. Reloading is safe: the pattern no longer
# matches once -O is in.
run-shell 'f=$(mktemp) && tmux list-keys -T root | grep "MouseDown3" | sed "s/display-menu -T/display-menu -O -T/" > "$f" && tmux source-file "$f"; rm -f "$f"'

# tmux defaults to 2000 lines, which is the actual reason scrollback runs out
# so fast.
set -g history-limit 50000

# Tell applications when a pane gains or loses focus. Without it nvim does not
# know it was backgrounded, so autoread misses files changed in another pane and
# anything refreshing on focus simply does not. Matters here because panes get
# switched constantly through vim-tmux-navigator.
set -g focus-events on

# Set the default terminal mode to 256color mode
set -g default-terminal "tmux-256color"

# Pass OSC 8 hyperlinks (Claude Code's clickable file links) through to WezTerm.
# tmux 3.4 forwards them only when the outer terminal declares the feature, and
# WezTerm presents itself as xterm-256color, which tmux does not credit with it.
# Read when a client attaches: an already-attached client needs a reattach.
set -as terminal-features "xterm*:hyperlinks"

# Powerline half circles, U+E0B6 / U+E0B4 -- the closest a terminal gets to the
# bar's border-radius. Defined once here and referenced by option so the glyphs
# appear in a single place in this file.
set -g @cap_l ""
set -g @cap_r ""

# ---- Status bar -----------------------------------------------------------
# Styling is catppuccin/tmux's job, not this file's. The hand-rolled version
# this replaces had to work around three tmux quirks -- style options are not
# format-expanded, formats expand exactly one level, and a comma inside
# #{?cond,a,b} ends the argument -- and still shipped with every glyph stripped.
# The plugin handles all of it and draws the rounded two-tone window pills.
#
# Flavour follows the Zebar bar rather than wezterm, which is on Mocha; the two
# are worth unifying at some point.
set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_window_status_style "rounded"

# Round both ends and keep modules apart. The plugin ships a powerline default
# -- no left cap, a solid block on the right, segments butted together -- which
# is the opposite of the Zebar bar's floating islands. Writing the half circles
# through a tmux option rather than inline keeps them out of format strings.
set -g @catppuccin_status_left_separator "#{@cap_l}"
set -g @catppuccin_status_right_separator "#{@cap_r}"
set -g @catppuccin_status_connect_separator "no"

# The pill shows the window name, not the pane title. #T defaults to the
# hostname and only ever changes if a program sets it via escape sequence, which
# allow-rename off blocks -- so the default renders a name that never updates.
# #W tracks automatic-rename, which is on and follows pane_current_command.
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Session on the left, working directory on the right: the things tmux knows
# that the Zebar bar does not. Clock, CPU and RAM are deliberately absent --
# they are already on the bar above, and this one is meant to stay quiet.
#
# Set here, before tpm runs, for two reasons. #{E:...} defers evaluation to
# render time, so these resolve even though catppuccin has not loaded yet. And
# continuum's save timer works by prepending a hidden interpolation to
# status-right when it loads -- assigning status-right after tpm would drop that
# hook and silently stop auto-saving.
set -g status-left-length 100
set -g status-right-length 100
# Trailing space is load-bearing: the session pill ends on its right cap and the
# first window begins on its left cap, so without it the two round ends butt
# together and read as one lump. window-status-separator already puts the same
# single space between windows, so this just makes the first gap match the rest.
set -g status-left "#{E:@catppuccin_status_session} "
set -g status-right "#{?client_last_session,#[fg=#{@thm_overlay_1}]⇄ #{client_last_session}  #[default],}#{E:@catppuccin_status_directory}"

set -g status-justify left

# Five seconds, not sixty: continuum piggybacks on this refresh to decide when
# to save.
set -g status-interval 5

# Enable vi keys.
set -w -g mode-keys vi

# Use vim keybindings for copy-paste
# prefix+u for scrollback: u for up, right index finger, no stretch. Ctrl
# already sits on the home row on this keyboard, so a prefix binding on a
# home-row-adjacent key is the cheapest thing available -- cheaper than Escape
# at the top left, and far cheaper than Shift+PageUp, which is barely on the
# board at all.
#
# Plain copy-mode, not -u. The -u form scrolls up a page on entry, which loses
# your place before you have looked at anything: the thing you were reading is
# what you want to scroll back from, so entry has to land on the cursor exactly
# where it already is. Move from there with C-u, C-b or a search.
bind -N "Scrollback (copy mode)" u copy-mode
bind -N "Scrollback (copy mode)" Escape copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
unbind p
bind -N "Paste" p paste-buffer

# Copy to the Windows clipboard via OSC 52 (tmux forwards it to WezTerm).
# Replaces clip.exe, which decoded UTF-8 as CP437 and mangled em dashes.
set -s set-clipboard on
# Drag no longer copies. With mouse on, any click that moved even one cell
# entered copy-mode, selected, and copied straight to the system clipboard via
# set-clipboard -- so a soft click to focus a pane silently clobbered whatever
# was on the clipboard, which is the kind of data loss you only discover when
# you paste. Drag still selects; y copies deliberately, matching the v/y above
# and the same motion vim already trains.
unbind -T copy-mode-vi MouseDragEnd1Pane

# Split pane and retain the current directory of existing pane
bind -N "Split top/bottom, same directory" _ split-window -v -c "#{pane_current_path}"
bind -N "Split left/right, same directory" \\ split-window -h -c "#{pane_current_path}"

# New windows open where the pane you are in is. The default `c` is a bare
# new-window, which uses the SESSION's start directory -- and resurrect sets
# that from the session's first pane, which is the workmux sidebar, which sits
# in whatever directory the sidebar was first started from.
bind -N "New window, same directory" c new-window -c "#{pane_current_path}"

# Prefix-free splits, always in the current directory.
# Named the way vim names them, not the way tmux's flags do: C-/ is the
# "vertical split" that puts panes side by side, same as nvim's <leader>sv.
# Ctrl+/ reaches tmux as C-_ (see tmux#1827), which is what has to be bound.
bind -n C-_ split-window -h -c "#{pane_current_path}"
bind -n C-\\ split-window -v -c "#{pane_current_path}"

# Shortcut for synchronize-panes toggle
bind -N "Toggle typing into all panes" C-s set-window-option synchronize-panes

# Popup
# Searchable keybinding reference on prefix+?, replacing `list-keys -N`.
#
# The default dumps every binding as raw config lines into a pager. This is the
# tmux equivalent of which-key in nvim: type "session" and see every binding
# that touches sessions, with the full command in a preview pane.
bind -N "Search all keybindings" ? display-popup -w 90% -h 80% -x C -y C -E '~/.config/tmux/scripts/tmux-keys.sh'

# workmux menu on prefix+w, replacing the default `choose-tree -Zw` -- sessionx
# on prefix+o is the better session switcher, so the default was redundant.
#
# The sidebar entry is the point of this: jumping into an agent's session
# leaves the sidebar behind in the session you came from, and there is no
# auto-start option, so `workmux sidebar` has to be one keystroke from
# wherever you land.
#
# Popups rather than panes so nothing resizes the window an agent is drawing
# into. The helper scripts parse `workmux list --json` because open/close take
# the worktree HANDLE, while the table output shows the branch.
# The sidebar toggle is per SESSION: the global one makes ~330-630 serial tmux
# calls across every window (4-12 s at 103 windows, workmux 0.1.275).
bind -N "workmux menu" w display-menu -x C -y C -T "#[align=centre]workmux" \
    "add"             a "display-popup -d '#{pane_current_path}' -w 60% -h 20% -E '~/.config/tmux/scripts/workmux-add.sh plain'" \
    "add w/ prompt"   p "display-popup -d '#{pane_current_path}' -w 60% -h 25% -E '~/.config/tmux/scripts/workmux-add.sh prompt'" \
    "add (auto-name)" A "display-popup -d '#{pane_current_path}' -w 60% -h 20% -E '~/.config/tmux/scripts/workmux-add.sh auto'" \
    "" \
    "open"            o "display-popup -d '#{pane_current_path}' -w 80% -h 60% -E '~/.config/tmux/scripts/workmux-fzf.sh open'" \
    "close"           c "display-popup -d '#{pane_current_path}' -w 80% -h 60% -E '~/.config/tmux/scripts/workmux-fzf.sh close'" \
    "remove"          r "display-popup -d '#{pane_current_path}' -w 80% -h 60% -E '~/.config/tmux/scripts/workmux-fzf.sh remove'" \
    "" \
    "dashboard"       d "display-popup -d '#{pane_current_path}' -w 90% -h 90% -E 'workmux dashboard'" \
    "sidebar toggle"  s "run-shell 'workmux sidebar --session'" \
    "" \
    "quit"            q ""

bind -N "Shell popup in ~" 0 display-popup -d "~/" \
	-x C -y C -w 50% -h 50% \
	-e "POPUP=true" -E "bash"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'omerxx/tmux-sessionx'

# resurrect only saves when asked, which is why the newest save on this machine
# was two days old when the server went down. continuum saves on a timer and
# restores on server start, so an unplanned exit costs minutes, not everything.
#
# Note continuum works by prepending a hidden interpolation to status-right --
# that is its timer. Anything that sets status-right after tpm runs silently
# removes the hook and stops auto-saving. The status bar above is configured
# before this block for exactly that reason.
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# The workmux sidebar is a pane, so resurrect saves it and brings it back as a
# bare zsh -- on top of the sidebar workmux adds itself. Every restore then adds
# a shell to every window. This drops the stand-ins right after a restore; see
# the script for the guards that keep it from touching a running server.
# (~, not $HOME: tmux stores a literal \$HOME in a user option, and resurrect
# eval's the value, so $HOME would never expand and the hook would not run.)
set -g @resurrect-hook-post-restore-all '~/.config/tmux/scripts/resurrect-drop-sidebars.sh'

# The exact fix, at save time: the live server still knows which panes are
# sidebars (@workmux_role), so strip them from the save file before resurrect
# decides whether it changed, and rename the captured pane contents to the
# renumbered indexes afterwards. A restore then never has a stand-in to kill;
# the post-restore hook above stays as a no-op belt for old save files.
set -g @resurrect-hook-post-save-layout '~/.config/tmux/scripts/resurrect-strip-sidebars.py layout'
set -g @resurrect-hook-post-save-all '~/.config/tmux/scripts/resurrect-strip-sidebars.py contents'

# Session switcher on prefix+o. zoxide mode means the list is ranked by where
# you actually work rather than alphabetically; fzf and zoxide are both already
# installed, which is all it needs.
set -g @sessionx-bind 'o'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-preview-enabled 'true'
set -g @vim_navigator_prefix_mapping_clear_screen ''
# Give up "previous pane" to free C-\ for splitting. The plugin binds this at
# root level, so without this the split binding below is silently overridden.
set -g @vim_navigator_mapping_prev ''

# Initialize Plugin Manager
# Continuum restores whatever resurrect's "last" symlink points at. If a save
# fires while the server is shutting down there are no sessions left to record
# and the file lands empty -- then the next start restores nothing, the session
# it started in goes away with it, and tmux looks like it exits instantly.
#
# Repoint "last" at the newest save that actually has content. Runs before tpm
# so it lands before continuum reads the link, and deliberately not with -b,
# which would race it. No-ops when the link is already healthy or no saves exist.
run-shell 'R="$HOME/.local/share/tmux/resurrect"; [ -s "$R/last" ] || for f in $(ls -t "$R"/tmux_resurrect_*.txt 2>/dev/null); do [ -s "$f" ] && ln -sfn "$(basename "$f")" "$R/last" && break; done'

run '~/.config/tmux/plugins/tpm/tpm'
