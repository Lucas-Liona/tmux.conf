# The menu behind the ⌘ on the tmux status bar (scripts/status-click). Read on every click:
# save the file and the next click shows it. Right-click the ⌘ to open this file.
#
# One item a line:   label   key   action
# Fields are split by two or more spaces, or tabs. The key is one character and may be left
# out. A blank line draws a rule. A line that does not parse shows greyed with its number.
#
#   tmux: <command>   a tmux command, run as if bound to a key; formats like #{pane_id} are
#                     the pane and client you clicked from.
#   sh: <code>        zsh, in a popup, with your aliases and PATH, in that pane's directory.
#                     $STATUS_PANE is the pane, $STATUS_MENU this file. The popup closes when
#                     the code ends, so page what prints (| less -R); if it fails the popup
#                     stays up with the error.

panel               p  sh: panel.py --days 1 --budget 3000 | less -R
aq                  a  sh: aq
local models        l  tmux: run-shell -b '~/.config/tmux/scripts/local-models --toggle'
skills in this pane  s  tmux: run-shell -b 'tmux display-popup -c #{q:client_name} -t #{q:pane_id} -w 80% -h 50% -T " skills " -E "~/.config/tmux/scripts/skill-badge show #{q:pane_id}"'
hand off (prefix T)  t  tmux: run-shell -b '~/.config/tmux/scripts/handoff.py #{q:pane_id} #{q:pane_pid} #{q:pane_current_path} #{q:session_id} #{q:client_name}'

new session         n  tmux: command-prompt -p "new session:" "new-session -d -s '%1' ; switch-client -t '%1'"
ask claude          c  sh: read "q?ask claude: " && [[ -n $q ]] && print asking… && claude -p "$q" | less -R

edit this menu      e  sh: ${EDITOR:-nvim} $STATUS_MENU
